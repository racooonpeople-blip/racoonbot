name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python code
        run: python -m py_compile bot.py security_guards.py tests/test_security_guards.py
      - name: Test safeguards
        run: python -m unittest discover -s tests -v
